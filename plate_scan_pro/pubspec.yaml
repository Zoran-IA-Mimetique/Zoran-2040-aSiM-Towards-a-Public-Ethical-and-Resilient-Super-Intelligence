name: plate_scan_pro
description: ZORAN PLATE SCAN PRO - ANPR field tool for parking agents (offline).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Camera & field mode
  camera: ^0.11.0+2

  # OCR (offline, bundled model)
  google_mlkit_text_recognition: ^0.13.1

  # Storage
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

  # Geolocation
  geolocator: ^13.0.1
  geocoding: ^3.0.0

  # Feedback
  vibration: ^2.0.0

  # Export / share
  share_plus: ^10.0.2
  csv: ^6.0.0
  excel: ^4.0.6
  pdf: ^3.11.1

  # Image crop (visual proof)
  image: ^4.2.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
