name: Deploy PWA to GitHub Pages

# Déploie l'application compilée sur GitHub Pages.
# Résultat : une URL publique ouvrable depuis un téléphone, installable en PWA.
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # NOTE : GitHub Pages doit être activé UNE fois dans les réglages du dépôt
      # (Settings → Pages → Source = "GitHub Actions"). Le jeton du robot n'a pas
      # le droit de l'activer seul. Une fois activé, ce déploiement est automatique.
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
